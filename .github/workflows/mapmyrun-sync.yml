name: Sync MapMyRun

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MMF_CLIENT_ID: ${{ secrets.MMF_CLIENT_ID }}
      MMF_ACCESS_TOKEN: ${{ secrets.MMF_ACCESS_TOKEN }}
      MMF_USER_ID: ${{ secrets.MMF_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$MMF_CLIENT_ID" && -n "$MMF_ACCESS_TOKEN" && -n "$MMF_USER_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "MapMyRun sync not configured yet; skipping."
          fi
      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        if: steps.config.outputs.ready == 'true'
        run: pip install requests
      - name: Sync workouts
        if: steps.config.outputs.ready == 'true'
        run: python scripts/mapmyrun_sync.py
      - name: Commit updated cardio data
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/cardio.json; then
            echo "No new MapMyRun data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardio.json
          git commit -m "Sync MapMyRun cardio data"
          git push
